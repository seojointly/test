name: Project Status Guard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Read Project items
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
        run: |
          echo "=== Project Items ==="

          gh project item-list 2 \
            --owner @me \
            --format json \
            > project.json

          cat project.json

          echo ""
          echo "=== Done Items ==="

          jq -r '
            .items[]
            | select(.status == "Done")
            | {
                id: .id,
                status: .status,
                title: .content.title,
                type: .content.type,
                number: .content.number,
                url: .content.url
              }
          ' project.json